[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "itchevi"
version = "0.5.1"
description = "Failure-aware qualification of donor-level transcriptomic evidence"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "ItchEvi contributors"}]
keywords = ["bioinformatics", "single-cell", "reproducibility", "qualification"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "jsonschema>=4.22,<5"
]

[project.optional-dependencies]
test = []
full = [
  "gseapy==1.3.0",
  "snakemake>=8,<10"
]

[project.scripts]
itchevi = "itchevi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["itchevi*"]

[tool.setuptools.package-data]
itchevi = ["schemas/*.json"]
