name: Verify Zenodo archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the latest archived DOI
        shell: bash
        run: |
          set -euo pipefail
          repository_id=1320882942
          badge_url="https://zenodo.org/badge/latestdoi/${repository_id}"
          headers="$(mktemp)"
          curl --fail --silent --show-error --location \
            --dump-header "$headers" --output /dev/null "$badge_url"
          doi="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { gsub("\\r", ""); print $2 }' "$headers" \
            | grep -Eo '10\.5281/zenodo\.[0-9]+' | tail -n 1 || true)"
          if [[ -z "$doi" ]]; then
            final_url="$(curl --fail --silent --show-error --location \
              --output /dev/null --write-out '%{url_effective}' "$badge_url")"
            doi="$(printf '%s' "$final_url" | grep -Eo '10\.5281/zenodo\.[0-9]+' || true)"
          fi
          if [[ -z "$doi" ]]; then
            echo "ZENODO_ARCHIVE_NOT_READY"
            exit 1
          fi
          printf 'ZENODO_DOI=%s\n' "$doi"
          printf 'ZENODO_URL=https://doi.org/%s\n' "$doi"
          {
            echo '## Zenodo archive'
            echo
            printf -- '- DOI: `%s`\n' "$doi"
            printf -- '- URL: https://doi.org/%s\n' "$doi"
          } >> "$GITHUB_STEP_SUMMARY"
