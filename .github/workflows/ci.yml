name: itchevi-ci

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies and build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m pip install ".[test]"
          python -m build --wheel
      - name: Reinstall release wheel
        run: python -m pip install --force-reinstall --no-deps dist/itchevi-*.whl
      - name: Verify dependencies
        run: python -m pip check
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
      - name: Run installed CLI demo
        run: itchevi demo --workdir ci_demo
      - name: Run normalized-JSON smoke test
        run: |
          itchevi normalize \
            --evidence ci_demo/inputs/evidence.tsv \
            --entities ci_demo/inputs/entities.tsv \
            --layers ci_demo/inputs/layers.tsv \
            --config ci_demo/inputs/qualification_config.json \
            --output ci_normalized
      - name: Upload acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: itchevi-python-${{ matrix.python-version }}
          path: |
            dist/*.whl
            ci_demo/results/
            ci_normalized/
          if-no-files-found: error
